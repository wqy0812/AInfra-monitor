global:
  scrape_interval: 5s
  scrape_timeout: 4s
scrape_configs:
- job_name: sglang-prefill
  static_configs:
  - targets: ['122.235.251.106:31125']
    labels: {environment: dcu-pd, role: prefill, node: dcu1, service: sglang}
  - targets: ['122.209.21.33:8501']
    labels: {environment: xpu-pd, role: prefill, node: xpu-1, service: sglang}
  metric_relabel_configs:
  - source_labels: [environment, __name__]
    regex: '((.*;sglang:(num_requests_total|prompt_tokens_total|generation_tokens_total|cached_tokens_total|num_running_reqs|num_queue_reqs|token_usage|cache_hit_rate|hicache_host_used_tokens|hicache_host_total_tokens|prefill_effective_tokens_total|realtime_tokens_total|(time_to_first_token_seconds|inter_token_latency_seconds|e2e_request_latency_seconds)_(bucket|count|sum))|xpu-pd;sglang:(load_back_tokens_total|evicted_tokens_total|(load_back|eviction)_duration_seconds_(bucket|sum|count)|hicache_scheduler_idle_with_pending(_seconds)?_total|num_used_tokens|max_total_num_tokens))|dcu-pd;sglang:(max_total_num_tokens|max_total_num_tokens_swa|num_used_tokens|kv_available_tokens|kv_evictable_tokens|kv_used_tokens|swa_available_tokens|swa_evictable_tokens|swa_used_tokens|swa_token_usage|num_prefill_bootstrap_queue_reqs|num_prefill_inflight_queue_reqs|num_decode_prealloc_queue_reqs|num_decode_transfer_queue_reqs|num_transfer_failed_reqs_total|hicache_backup_tokens_total|hicache_backup_bytes_total|load_back_tokens_total|load_back_bytes_total|hicache_dropped_tokens_total|(queue_time_seconds|per_stage_req_latency_seconds|kv_transfer_latency_ms|kv_transfer_total_mb|kv_transfer_speed_gb_s|kv_transfer_bootstrap_ms|kv_transfer_alloc_ms|hicache_backup_duration_seconds|load_back_duration_seconds)_(bucket|sum|count)))'
    action: keep
- job_name: sglang-decode
  static_configs:
  - targets: ['122.235.251.182:31127']
    labels: {environment: dcu-pd, role: decode, node: dcu2, service: sglang}
  - targets: ['122.209.21.34:8501']
    labels: {environment: xpu-pd, role: decode, node: xpu-2, service: sglang}
  metric_relabel_configs:
  - source_labels: [environment, __name__]
    regex: '(.*;sglang:(num_requests_total|prompt_tokens_total|generation_tokens_total|cached_tokens_total|num_running_reqs|num_queue_reqs|token_usage|cache_hit_rate|hicache_host_used_tokens|hicache_host_total_tokens|prefill_effective_tokens_total|realtime_tokens_total|(time_to_first_token_seconds|inter_token_latency_seconds|e2e_request_latency_seconds)_(bucket|count|sum))|dcu-pd;sglang:(max_total_num_tokens|max_total_num_tokens_swa|num_used_tokens|kv_available_tokens|kv_evictable_tokens|kv_used_tokens|swa_available_tokens|swa_evictable_tokens|swa_used_tokens|swa_token_usage|num_prefill_bootstrap_queue_reqs|num_prefill_inflight_queue_reqs|num_decode_prealloc_queue_reqs|num_decode_transfer_queue_reqs|num_transfer_failed_reqs_total|hicache_backup_tokens_total|hicache_backup_bytes_total|load_back_tokens_total|load_back_bytes_total|hicache_dropped_tokens_total|(queue_time_seconds|per_stage_req_latency_seconds|kv_transfer_latency_ms|kv_transfer_total_mb|kv_transfer_speed_gb_s|kv_transfer_bootstrap_ms|kv_transfer_alloc_ms|hicache_backup_duration_seconds|load_back_duration_seconds)_(bucket|sum|count)))'
    action: keep
- job_name: mooncake
  static_configs:
  - targets: ['122.235.251.182:9004']
    labels: {environment: dcu-pd, node: dcu2, service: mooncake}
  metric_relabel_configs:
  - source_labels: [__name__]
    regex: '(master_allocated_bytes|master_total_capacity_bytes|segment_allocated_bytes|segment_total_capacity_bytes|valid_get_nums_|total_get_nums_|master_allocated_file_size_bytes|master_total_file_capacity_bytes|mem_cache_hit_nums_|file_cache_hit_nums_)'
    action: keep
- job_name: node-prefill
  metrics_path: /node-metrics
  static_configs:
  - targets: ['122.235.251.106:19500']
    labels: {environment: dcu-pd, role: prefill, node: dcu1, service: host}
  metric_relabel_configs:
  - source_labels: [__name__]
    regex: 'node_(load1|load5|load15|cpu_seconds_total|boot_time_seconds|memory_.*_bytes|filesystem_(size|avail)_bytes|network_(receive|transmit)_bytes_total|disk_(read|written)_bytes_total)'
    action: keep
- job_name: node-decode
  metrics_path: /node-metrics
  static_configs:
  - targets: ['122.235.251.182:19500']
    labels: {environment: dcu-pd, role: decode, node: dcu2, service: host}
  metric_relabel_configs:
  - source_labels: [__name__]
    regex: 'node_(load1|load5|load15|cpu_seconds_total|boot_time_seconds|memory_.*_bytes|filesystem_(size|avail)_bytes|network_(receive|transmit)_bytes_total|disk_(read|written)_bytes_total)'
    action: keep
- job_name: dcu-prefill
  static_configs:
  - targets: ['122.235.251.106:19500']
    labels: {environment: dcu-pd, role: prefill, node: dcu1, service: dcu}
- job_name: dcu-decode
  static_configs:
  - targets: ['122.235.251.182:19500']
    labels: {environment: dcu-pd, role: decode, node: dcu2, service: dcu}
- job_name: vmagent
  static_configs:
  - targets: ['127.0.0.1:18429']
    labels: {environment: dcu-pd}
- job_name: victoriametrics
  static_configs:
  - targets: ['127.0.0.1:18428']
    labels: {environment: dcu-pd}
- job_name: aigate
  bearer_token_file: /config/aigate-profile-key
  static_configs:
  - targets: ['122.235.251.106:18082']
    labels: {environment: dcu-pd, node: dcu1, service: aigate}
  metric_relabel_configs:
  - source_labels: [__name__]
    regex: 'aigate_.*'
    action: keep
- job_name: vllm-a3
  static_configs:
  - targets: ['122.209.21.24:7100', '122.209.21.24:7101', '122.209.21.24:7102', '122.209.21.24:7103']
    labels: {environment: a3-vllm, node: a3-1, service: vllm}
  - targets: ['122.209.21.25:7100', '122.209.21.25:7101', '122.209.21.25:7102', '122.209.21.25:7103']
    labels: {environment: a3-vllm, node: a3-2, service: vllm}
  metric_relabel_configs:
  - source_labels: [__name__]
    regex: 'vllm:.*'
    action: keep
- job_name: node-a3
  static_configs:
  - targets: ['122.209.21.24:9100']
    labels: {environment: a3-vllm, node: a3-1, service: host}
  - targets: ['122.209.21.25:9100']
    labels: {environment: a3-vllm, node: a3-2, service: host}
  metric_relabel_configs:
  - source_labels: [__name__]
    regex: 'node_.*'
    action: keep
- job_name: npu-a3
  honor_timestamps: true
  static_configs:
  - targets: ['122.209.21.24:8082']
    labels: {environment: a3-vllm, node: a3-1, service: npu}
  - targets: ['122.209.21.25:8082']
    labels: {environment: a3-vllm, node: a3-2, service: npu}
  metric_relabel_configs:
  - source_labels: [__name__]
    regex: '(npu_.*|machine_npu_nums)'
    action: keep
- job_name: aigate-a3
  bearer_token_file: /config/aigate-a3-profile-key
  static_configs:
  - targets: ['122.52.5.131:18082']
    labels: {environment: a3-vllm, node: worker-131, service: aigate}
  relabel_configs:
  - target_label: job
    replacement: aigate
  metric_relabel_configs:
  - source_labels: [__name__]
    regex: 'aigate_.*'
    action: keep

- job_name: aigate-xpu
  bearer_token_file: /config/xpu-profile-key
  static_configs:
  - targets: ['122.209.21.33:18082']
    labels: {environment: xpu-pd, node: xpu-1, service: aigate}
  relabel_configs:
  - target_label: job
    replacement: aigate
  metric_relabel_configs:
  - source_labels: [__name__]
    regex: 'aigate_.*'
    action: keep

- job_name: node-xpu
  metrics_path: /metrics
  scrape_interval: 5s
  scrape_timeout: 4s
  static_configs:
  - targets: ['122.209.21.33:9110']
    labels: {environment: xpu-pd, role: prefill, node: xpu-1, service: host}
  - targets: ['122.209.21.34:9110']
    labels: {environment: xpu-pd, role: decode, node: xpu-2, service: host}
  metric_relabel_configs:
  - source_labels: [__name__]
    regex: 'node_.*'
    action: keep

- job_name: xpu-hardware
  metrics_path: /metrics
  scrape_interval: 5s
  scrape_timeout: 4s
  static_configs:
  - targets: ['122.209.21.33:9507']
    labels: {environment: xpu-pd, role: prefill, node: xpu-1, service: xpu-exporter}
  - targets: ['122.209.21.34:9507']
    labels: {environment: xpu-pd, role: decode, node: xpu-2, service: xpu-exporter}
  metric_relabel_configs:
  - source_labels: [__name__]
    regex: 'node_xpu_.*'
    action: keep

- job_name: mooncake-a3
  static_configs:
  - targets: ['122.209.21.24:9003']
    labels: {environment: a3-vllm, node: a3-1, service: mooncake}
  metric_relabel_configs:
  - source_labels: [__name__]
    regex: '(master_allocated_bytes|master_total_capacity_bytes|master_allocated_file_size_bytes|master_total_file_capacity_bytes|master_key_count|master_active_clients|master_exist_key_requests_total|master_exist_key_failures_total|master_put_start_requests_total|master_put_start_failures_total|master_put_end_requests_total|master_put_end_failures_total|master_put_revoke_requests_total|master_put_revoke_failures_total|master_get_replica_list_requests_total|master_get_replica_list_failures_total|master_batch_exist_key_requests_total|master_batch_exist_key_failures_total|master_batch_put_start_requests_total|master_batch_put_start_failures_total|master_batch_put_end_requests_total|master_batch_put_end_failures_total|master_batch_put_revoke_requests_total|master_batch_put_revoke_failures_total|master_batch_get_replica_list_requests_total|master_batch_get_replica_list_failures_total|master_attempted_evictions_total|master_successful_evictions_total|master_evicted_key_count|master_evicted_size_bytes)'
    action: keep
